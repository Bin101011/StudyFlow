<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 글자가 깨지지 않게 한글(UTF-8)을 쓴다고 알려준다 -->
    <meta charset="UTF-8">
    <!-- 브라우저 탭이나 창 제목줄에 표시되는 이름 -->
    <title>StudyFlow</title>
    <!-- static 폴더의 style.css를 불러와서 화면에 적용한다 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- 탭 버튼들이 모이는 영역. active가 붙은 버튼이 "지금 선택된 탭"이다 -->
    <nav>
        <button class="tab-button active" data-tab="calendar">캘린더</button>
        <button class="tab-button" data-tab="today">오늘</button>
        <button class="tab-button" data-tab="projects">프로젝트</button>
        <button class="tab-button" data-tab="settings">설정</button>
    </nav>

    <!-- 탭을 누르면 보여줄 내용들이 모이는 영역. active가 붙은 내용만 화면에 보인다 -->
    <main>
        <div class="tab-content active" id="calendar">
            <!-- 캘린더 탭 전체를 왼쪽(캘린더 목록)과 오른쪽(달력)으로 나누는 상자 -->
            <div class="calendar-layout">
                <!-- 왼쪽: 캘린더 목록. 체크박스들은 app.js가 여기에 채워 넣는다 -->
                <aside id="calendar-list">
                    <h2>내 캘린더</h2>
                </aside>
                <!-- 오른쪽: 달력이 그려질 빈 칸. FullCalendar가 이 안에 달력을 만든다 -->
                <div id="calendar-view"></div>
            </div>
        </div>
        <div class="tab-content" id="today">
            <!-- 맨 위: 보고 있는 날짜 제목 (예: 2026년 10월 19일 월요일)과 날짜 넘기는 버튼들.
                 탭을 열면 항상 오늘이고, ◀ ▶로 하루씩 넘겨 지난 날의 기록이나 다음 날의 계획을 볼 수 있다 -->
            <div class="today-header">
                <button id="day-prev" title="전날">◀</button>
                <h1 id="today-title"></h1>
                <button id="day-next" title="다음날">▶</button>
                <!-- 오늘이 아닌 날을 보고 있을 때만 보인다 -->
                <button id="day-today" hidden>오늘로 돌아가기</button>
            </div>

            <!-- 탭 전체를 왼쪽(일정)과 오른쪽(할 일)으로 나누는 상자 -->
            <div class="today-layout">
                <section class="today-column">
                    <h2 id="events-heading">오늘의 일정</h2>
                    <!-- 일정 줄들은 app.js가 /api/events에서 받아 여기에 만든다 -->
                    <ul id="today-events" class="today-list"></ul>
                </section>

                <section class="today-column">
                    <h2 id="tasks-heading">오늘 할 일</h2>
                    <!-- 할 일 입력 줄: 글자를 쓰고 Enter를 누르거나 추가 버튼을 누른다 -->
                    <div class="task-add">
                        <input type="text" id="task-input" placeholder="할 일을 입력하고 Enter">
                        <!-- 새 할 일을 어느 프로젝트에 연결할지. 선택지는 app.js가 프로젝트 목록으로 채운다 -->
                        <select id="task-project">
                            <option value="">프로젝트 없음</option>
                        </select>
                        <button id="task-add-button">추가</button>
                    </div>

                    <!-- 지난 날짜에 끝내지 못한 할 일. 있을 때만 보인다 -->
                    <div id="overdue-section" hidden>
                        <h3>밀린 할 일</h3>
                        <ul id="overdue-tasks" class="today-list"></ul>
                    </div>

                    <ul id="today-tasks" class="today-list"></ul>
                </section>
            </div>
        </div>
        <div class="tab-content" id="projects">
            <div class="projects-header">
                <h1>프로젝트</h1>
                <button id="project-add-button" class="primary">+ 새 프로젝트</button>
            </div>
            <!-- 프로젝트 카드들은 app.js가 /api/projects에서 받아 여기에 만든다 (마감일이 가까운 순) -->
            <div id="project-list"></div>
        </div>
        <div class="tab-content" id="settings">
            <h1>설정</h1>

            <section class="settings-section">
                <h2>화면 크기</h2>
                <p class="settings-hint">슬라이더를 움직이면 캘린더에 바로 반영되고, 자동으로 저장됩니다.</p>
                <!-- 슬라이더들은 app.js가 서버(/api/settings)에서 정의를 받아 여기에 만든다 -->
                <div id="slider-list"></div>
                <button id="settings-reset">기본값으로</button>
            </section>

            <section class="settings-section">
                <h2>일정 추가</h2>
                <label class="settings-row">
                    <span class="settings-label">기본 캘린더</span>
                    <!-- 선택지는 app.js가 캘린더 목록으로 채운다 -->
                    <select id="default-calendar-select">
                        <!-- 이 항목을 고르면 Google에서 정한 내 기본 캘린더가 미리 선택된다 -->
                        <option value="">자동 (내 기본 캘린더)</option>
                    </select>
                </label>
            </section>
        </div>
    </main>

    <!-- 일정 추가/수정 창. <dialog>는 평소에는 숨어 있다가 app.js가 showModal()을 부르면 화면 위에 뜨는 태그다.
         같은 창을 추가와 수정에 같이 쓴다. 칸의 id는 app.js가 찾는 이름이다 -->
    <dialog id="event-dialog">
        <h2 id="event-dialog-title">일정 추가</h2>

        <label class="dialog-row">제목
            <input type="text" id="event-title">
        </label>
        <label class="dialog-row">캘린더
            <!-- 안의 선택지(option)는 app.js가 캘린더 목록으로 채운다 -->
            <select id="event-calendar"></select>
        </label>
        <label class="dialog-row">
            <input type="checkbox" id="event-all-day"> 종일
        </label>
        <div class="dialog-row">시작
            <input type="date" id="event-start-date">
            <input type="time" id="event-start-time">
        </div>
        <div class="dialog-row">끝
            <input type="date" id="event-end-date">
            <input type="time" id="event-end-time">
        </div>

        <!-- 입력이 잘못됐거나 Google이 거절했을 때 이유를 보여주는 줄 -->
        <p id="event-error" class="dialog-error"></p>

        <div class="dialog-buttons">
            <!-- 삭제 버튼은 일정을 수정할 때만 보인다 -->
            <button id="event-delete" class="danger" hidden>삭제</button>
            <span class="spacer"></span>
            <button id="event-cancel">취소</button>
            <button id="event-save" class="primary">저장</button>
        </div>
    </dialog>

    <!-- 프로젝트 추가/수정 창. 일정 창과 같은 방식으로 추가와 수정에 같이 쓴다 -->
    <dialog id="project-dialog">
        <h2 id="project-dialog-title">새 프로젝트</h2>

        <label class="dialog-row">이름
            <input type="text" id="project-name">
        </label>
        <div class="dialog-row">마감일
            <input type="date" id="project-deadline">
            <button type="button" id="project-deadline-clear">지우기</button>
        </div>
        <label class="dialog-row">색
            <!-- <input type="color">: 브라우저가 주는 색 선택 도구 -->
            <input type="color" id="project-color">
        </label>
        <!-- radio: 여러 개 중 하나만 고르는 동그란 선택 칸. name이 같은 것끼리 한 묶음이다 -->
        <div class="dialog-row column">
            <span>진행률</span>
            <label><input type="radio" name="project-mode" value="auto" checked> 자동 (연결된 할 일 중 끝낸 비율)</label>
            <label><input type="radio" name="project-mode" value="manual"> 직접 입력 (카드의 슬라이더로 정함)</label>
        </div>

        <p id="project-error" class="dialog-error"></p>

        <div class="dialog-buttons">
            <!-- 삭제 버튼은 프로젝트를 수정할 때만 보인다 -->
            <button id="project-delete" class="danger" hidden>삭제</button>
            <span class="spacer"></span>
            <button id="project-cancel">취소</button>
            <button id="project-save" class="primary">저장</button>
        </div>
    </dialog>

    <!-- 드래그가 실패했을 때처럼, 창 밖에서 생긴 오류를 잠깐 띄우는 알림 줄 -->
    <div id="toast"></div>

    <!-- FullCalendar 라이브러리를 static/lib 폴더(내 컴퓨터)에서 불러온다. 인터넷이 없어도 달력 틀이 뜬다.
         app.js보다 먼저 불러와야 app.js에서 쓸 수 있다 -->
    <script src="{{ url_for('static', filename='lib/fullcalendar.min.js') }}"></script>
    <!-- FullCalendar 한국어 설정 파일. 본체 뒤에 불러와야 본체에 한국어가 추가된다 -->
    <script src="{{ url_for('static', filename='lib/fullcalendar-ko.js') }}"></script>

    <!-- 버튼과 내용이 모두 만들어진 뒤에 실행되도록 body 맨 끝에서 app.js를 불러온다 -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
